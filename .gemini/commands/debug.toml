# Generated by scripts/build-commands.js from .claude/commands/. Do not edit.
description = "Find the actual cause of a failure before changing any code"

prompt = """
Debug this: {{args}}

Use the `systematic-debugging` skill.

**Change no code until you can state the cause and predict what the fix will do.**

1. Reproduce it as a single command or a written sequence. If it is intermittent, make it
   deterministic: pin the seed, freeze the clock, force the interleaving, shrink the data.
   If you truly cannot reproduce it, say so and switch to adding observability.
2. Read all the evidence you already have, including the parts that look like boilerplate.
   Quote the decisive line.
3. State what you expected and what happened, one sentence each.
4. Narrow by bisection, not by sweeping. One change at a time.
5. Form a hypothesis that predicts something new, then check that prediction.
6. Prove the cause before fixing it.
7. Fix, re-run the reproduction, run the full suite, and add the regression test named
   after the bug.

If the fix turns out to be a retry, a sleep, a lock that just helped, or a try/catch around
the symptom, you have not found it. Say so rather than shipping it.
"""
